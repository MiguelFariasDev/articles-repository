# Portas do host configuráveis via .env (útil quando 5432/6379/4566 já estão ocupadas).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: artigos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artigos"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    # Fixada na v3 (a tag "latest" atual exige conta/token do LocalStack).
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sns,sqs,dynamodb
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
